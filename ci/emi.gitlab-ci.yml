# Include in .gitlab-ci.yml, after a job or before_script that prepares the
# project's Python test environment (pytest, coverage.py >= 7.9):
#   include:
#     - remote: https://raw.githubusercontent.com/amorfatii/EMI/main/ci/emi.gitlab-ci.yml
# Only `stop` passes the job: repair (3), ask_person (4) and incomplete (5)
# fail it. EMI never merges.
emi:
  stage: test
  image: rust:1-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - apt-get update -qq && apt-get install -y -qq bubblewrap
    - cargo install --locked --git https://github.com/amorfatii/EMI emi-cli
    - >
      emi done --setting enforced --format json
      --baseline "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --candidate "$CI_COMMIT_SHA"
      > emi-done.json || code=$?
    - cat emi-done.json
    - exit ${code:-0}
  artifacts:
    when: always
    paths: [emi-done.json]
