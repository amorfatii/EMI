# Dogfood: EMI gates changes to its own Rust crates.
name: emi
on: pull_request
jobs:
  emi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked --path crates/emi-cli
      - uses: ./
        with:
          source: crates
          probe: rust
          profile: parity
