name: EMI
description: >
  Check a completion claim with enforced EMI verification and publish the
  receipt as a required job status. EMI reports; it never merges.
branding:
  icon: activity
  color: blue
inputs:
  baseline:
    description: Trusted baseline ref; defaults to the pull request base SHA. Required outside a PR.
    default: ""
  candidate:
    description: Candidate ref; defaults to the pull request head SHA, otherwise HEAD.
    default: ""
  comment:
    description: Post (or update) the receipt summary as a PR comment.
    default: "true"
  emi-version:
    description: Git ref of emi to build.
    default: main
outputs:
  action:
    description: stop, repair, ask_person, or incomplete.
    value: ${{ steps.done.outputs.action }}
  regression:
    description: held, broken, or unknown.
    value: ${{ steps.done.outputs.regression }}
  change:
    description: Level of change evidence.
    value: ${{ steps.done.outputs.change }}
runs:
  using: composite
  steps:
    - name: Install emi
      shell: bash
      run: |
        if ! command -v emi >/dev/null; then
          cargo install --locked --git https://github.com/amorfatii/EMI --rev "${{ inputs.emi-version }}" emi-cli
        fi
    - name: Completion evidence
      id: done
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha }}
        CANDIDATE: ${{ inputs.candidate || github.event.pull_request.head.sha || 'HEAD' }}
      run: bash "${{ github.action_path }}/ci/done-status.sh"
    - name: Upload completion receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: emi-completion-receipt
        path: |
          emi-done.json
          emi-comment.md
        if-no-files-found: warn
    - name: Comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file emi-comment.md \
          || gh pr comment "${{ github.event.pull_request.number }}" --body-file emi-comment.md
    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.done.outputs.code }}
      run: exit "${CODE:-5}"
