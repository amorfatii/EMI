# JavaScript/TypeScript rules.
rules:
  - id: js-debugger
    languages: [js, ts]
    severity: error
    message: "`debugger` statement left in code"
    description: A debugger statement pauses execution under an inspector and never belongs in committed code.
    tags: [correctness]
    query: "(debugger_statement) @match"
    examples:
      match: ["function f() { debugger; return 1; }"]
      no_match: ["function f() { return 1; }"]

  - id: js-focused-test
    languages: [js, ts]
    exclude: ["*fixtures/*", "*__fixtures__/*"]
    severity: error
    tests: only
    message: "Focused test `{{fn}}.only` skips every other test in the file"
    description: "`.only` left in a suite silently disables the rest of it in CI."
    tags: [test-weakening]
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @fn
          property: (property_identifier) @prop)
        (#match? @fn "^(describe|it|test|context|suite|specify)$")
        (#eq? @prop "only")) @match
    examples:
      match: ["it.only('works', () => {});", "describe.only('x', () => {});"]
      no_match: ["it('works', () => {});", "list.only(1);"]

  - id: js-skipped-test
    languages: [js, ts]
    exclude: ["*fixtures/*", "*__fixtures__/*"]
    severity: warning
    tests: only
    message: "Skipped test `{{fn}}`"
    description: Skipped tests stop guarding behavior; delete them or fix them, and say why if they must stay.
    tags: [test-weakening]
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @fn
          property: (property_identifier) @prop)
        (#match? @fn "^(describe|it|test|context|suite|specify)$")
        (#eq? @prop "skip")) @match
      (call_expression
        function: (identifier) @fn
        (#match? @fn "^(xit|xdescribe|xtest|xcontext|xspecify)$")) @match
    examples:
      match: ["it.skip('slow', () => {});", "xit('old', () => {});"]
      no_match: ["it('runs', () => {});", "stream.skip(3);"]

  - id: js-identical-branches
    languages: [js, ts]
    severity: warning
    message: "Both branches of this conditional are identical"
    description: >
      An if/else or ternary whose branches are the same text does not branch;
      usually a copy-paste slip or an unfinished edit.
    tags: [correctness, ai-slop]
    query: |
      (if_statement
        consequence: (_) @a
        alternative: (else_clause (_) @b)
        (#eq? @a @b)) @match
      (ternary_expression
        consequence: (_) @a
        alternative: (_) @b
        (#eq? @a @b)) @match
    examples:
      match:
        - "if (x) { go(1); } else { go(1); }"
        - "const y = c ? a.b : a.b;"
      no_match:
        - "if (x) { go(1); } else { go(2); }"
        - "const y = c ? 1 : 2;"
        - "if (x) { go(1); } else if (y) { go(1); }"

  - id: js-self-assignment
    languages: [js, ts]
    severity: warning
    message: "`{{a}}` is assigned to itself"
    description: Assigning a value to itself has no effect; the intended right-hand side is usually another name.
    tags: [correctness]
    query: |
      (assignment_expression
        left: (_) @a
        right: (_) @b
        (#eq? @a @b)) @match
    examples:
      match: ["let x = 1; x = x;", "this.name = this.name;"]
      no_match: ["let x = 1; x = y;", "a.b = b.a;"]

  - id: js-eval
    languages: [js, ts]
    severity: warning
    message: "Dynamic code evaluation (`{{fn}}`)"
    description: eval and new Function execute strings as code; they defeat static analysis and are an injection risk.
    tags: [security]
    query: |
      (call_expression function: (identifier) @fn (#eq? @fn "eval")) @match
      (new_expression constructor: (identifier) @fn (#eq? @fn "Function")) @match
    examples:
      match: ["eval('1 + 1');", "const f = new Function('a', 'return a');"]
      no_match: ["evaluate('1');", "new Map();"]
