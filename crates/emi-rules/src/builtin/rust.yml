# Rust rules.
rules:
  - id: rust-dbg
    languages: [rust]
    severity: error
    tests: exclude
    message: "`dbg!` left in code"
    description: dbg! prints to stderr and returns its argument; it is a debugging aid that never belongs in committed product code.
    tags: [correctness]
    query: |
      (macro_invocation macro: (identifier) @m (#eq? @m "dbg")) @match
    examples:
      match: ["fn f(x: u8) -> u8 { dbg!(x) }"]
      no_match: ["fn f(x: u8) -> u8 { x }"]

  - id: rust-todo-macro
    languages: [rust]
    severity: warning
    tests: exclude
    message: "`{{m}}!` panics when reached"
    description: todo!() and unimplemented!() compile but panic at run time; unfinished code that passes type checking is exactly what agents leave behind.
    tags: [correctness, ai-slop]
    query: |
      (macro_invocation macro: (identifier) @m (#match? @m "^(todo|unimplemented)$")) @match
    examples:
      match: ["fn f() -> u8 { todo!() }", "fn g() { unimplemented!(\"later\") }"]
      no_match: ["fn f() -> u8 { unreachable!() }"]
