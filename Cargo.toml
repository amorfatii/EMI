[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
emi-kernel = { path = "crates/emi-kernel" }
emi-python = { path = "crates/emi-python" }
emi-exec = { path = "crates/emi-exec" }
emi-git = { path = "crates/emi-git" }
emi-tree = { path = "crates/emi-tree" }
emi-done = { path = "crates/emi-done" }
emi-driver = { path = "crates/emi-driver" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
tempfile = "3"
shlex = "2"

# The parser pin: changing it can change which lines EMI attributes to which
# function, so it moves only on purpose.
tree-sitter = "=0.26.2"
tree-sitter-python = "=0.25.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"

# Tests run the `emi` binary from the dev profile hundreds of times; with
# dependencies (hashing, JSON, the parser) optimized it does its own work
# faster, and they are compiled once and cached.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
