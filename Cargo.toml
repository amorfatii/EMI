[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
emi-ir = { path = "crates/emi-ir" }
emi-lang-python = { path = "crates/emi-lang-python" }
emi-lang-js = { path = "crates/emi-lang-js" }
emi-scan = { path = "crates/emi-scan" }
emi-history = { path = "crates/emi-history" }
emi-rules = { path = "crates/emi-rules" }
emi-exec = { path = "crates/emi-exec" }
emi-controller = { path = "crates/emi-controller" }
emi-lsp = { path = "crates/emi-lsp" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
indexmap = "2"
yaml_serde = "0.10"
rustix = { version = "1", features = ["process"] }
regex = "1"
thiserror = "2"

# Measurement contract pins: changing any of these changes measurements and
# requires a profile bump (the PROFILE constants in the adapter crates).
tree-sitter = "=0.26.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.9" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.9" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.9" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
